services:

  # ==========================================
  # Backend - FastAPI
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sova-backend

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    env_file:
      - .env

    volumes:
      - ./backend/app:/workspace/app
      - ./data:/workspace/data
      - ./rules:/workspace/rules
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    restart: unless-stopped


  # ==========================================
  # Frontend - React + Vite
  # ==========================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sova-frontend

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped


# ==========================================
# Docker Volumes
# ==========================================

volumes:
  frontend_node_modules: